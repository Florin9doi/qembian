# Sony Ericsson P990i keys -> Symbian scan codes -> host keys (QEMU translates: platform/families/semc-uiq3.toml).
# The scan codes are the ones the phone's own key table knows: EKData.dll (core 0xf83957f0) blocks 0x00-0x11,
# 0x41-0x5A, 0x60-0xA0, 0xA4-0xAC, 0xB1, 0xB5, 0xB9, 0xD4-0xD7 [V]; what each one does, from probes on the home
# screen (2026-11-17, docs/devices/se-p990i/bring-up.md "Keys") [V] or from its key code [I]. Digits are the numeric
# keypad codes (EStdKeyNkp0..9: 0x30-0x39 are not in the table, they produce nothing).
# Groups: "keypad" = the flip's phone keys (shown while the flip is closed), "qwerty" = the keyboard under the flip
# (shown while open), "nav" = the 5-way key and the jog dial, "front"/"side" = the rest.
schema = 1
device = "se-p990i"

[aliases]
select = "ok"
lock = "keylock"

[[keys]]
key = "up"
label = "Up"
scancode = "EStdKeyDevice4"
host = ["up"]
group = "nav"                    # 5-way up -> EKeyDevice4 [V: home screen opens the shortcut above]

[[keys]]
key = "down"
label = "Down"
scancode = "EStdKeyDevice5"
host = ["down"]
group = "nav"                    # 5-way down [V: list highlight moves down]

[[keys]]
key = "left"
label = "Left"
scancode = "EStdKeyDevice6"
host = ["left"]
group = "nav"                    # 5-way left [V: Calendar shortcut]

[[keys]]
key = "right"
label = "Right"
scancode = "EStdKeyDevice7"
host = ["right"]
group = "nav"                    # 5-way right [V: Today shortcut]

[[keys]]
key = "ok"
label = "Ok"
scancode = "EStdKeyDevice8"
host = ["ret", "f6"]
group = "nav"                    # 5-way centre = confirm [V: opens the Main menu]

[[keys]]
key = "jogup"
label = "Jog up"
scancode = "EStdKeyDevice1"
host = ["pgup"]
group = "nav"                    # jog dial up [V: focus moves; I: which way]

[[keys]]
key = "jogdown"
label = "Jog down"
scancode = "EStdKeyDevice2"
host = ["pgdn"]
group = "nav"                    # jog dial down [V: focus moves]

[[keys]]
key = "jogpress"
label = "Jog press"
scancode = "EStdKeyDevice1B"
host = ["home"]
group = "nav"                    # -> EKeyDevice8 (confirm) [I]

[[keys]]
key = "back"
label = "Back"
scancode = "EStdKeyDevice3"
host = ["esc"]
group = "front"                    # -> EKeyEscape [I]

[[keys]]
key = "clear"
label = "C"
scancode = "EStdKeyDevice0"
host = ["backspace"]
group = "front"                    # -> EKeyBackspace [I]

[[keys]]
key = "camera"
label = "Camera"
scancode = "EStdKeyDevice1D"
host = ["f9"]
group = "side"                    # -> EKeyDevice1D [V: starts the camera application]

[[keys]]
key = "keylock"
label = "Lock"
scancode = "EStdKeyDeviceD"
host = ["f8"]
group = "side"                    # the keylock slide: keylock.dll adds 0xB1 down/up [V unlocks]

