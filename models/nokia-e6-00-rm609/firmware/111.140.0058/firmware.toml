# Nokia E6-00 (RM-609) with firmware 111.140.0058 (Nokia Belle Refresh): core + India QWERTY rofs2 35.01 +
# rofs3 C00.01 + user data U05.01. Merged over models/nokia-e6-00-rm609/model.toml.

[firmware]
version = "111.140.0058"
obtain = """
Flash files of RM-609 111.140.0058 (rm-609.rar: two versions, 111.130.0625 and 111.140.0058): prd.core.fpsx,
the India QWERTY language pack 35.01 (prd.rofs2.fpsx), customer variant C00.01 (prd.rofs3.fpsx), user data U05.01
(uda.fpsx). tools/fw/store.py import the archive (roms/RM-609/111.140.0058).
"""

[[firmware.files]]
role = "core"
glob = "RM-609_111.140.0058_79_prd.core.fpsx"

[[firmware.files]]
role = "rofs2"
glob = "RM-609_111.140.0058_35.01_India_QW_79_prd.rofs2.fpsx"

[[firmware.files]]
role = "rofs3"
glob = "RM-609_111.140.0058_C00.01_79_prd.rofs3.fpsx"

[[firmware.files]]
role = "uda"
glob = "RM-609_111.140.0058_U05.01_79.uda.fpsx"
drive = "C"

[firmware.identity]
sw = { version = "111.140.0058", type_code = "RM-609" }

[firmware.rom]
user_window_start = 0x8046D1C0             # EDISP.DLL (probe.py header) [V]

# From the N8's Belle Refresh overlay (models/nokia-n8-rm596/firmware/111.040.1511), the same Belle Refresh start-up
# and audio: without the SIM indication the global start-up state went 103 -> 105 (emergency calls only), the
# non-critical start-up list (contentharvester, lockapp, satserver, javacaptain) never ran and every home-screen
# widget kept its loading spinner (2026-11-17, compared with the 808: 103 -> 104 -> 109).
# Belle's aamdaif.dll numbers the MdaifDriver controls differently from 011.012/Anna (start-up 1, 3 x7,
# 2, 6, 4, 0, 4 = the old 5, 7, 6, 10, 8, 2, 8 with the same arguments) [V: boot logs 2026-11-08]. Without
# the map the ring (old 8) and the buffer (old 2) were never answered and !AudioProcessingEngine copied
# through a NULL pointer (KERN-EXEC 3); a game's pause (Angry Birds) then hung on the audio server.
# Belle 5 (a1 = 0, at stream close) has no old equivalent: 15 = accepted.
[[standins]]
name = "aamdaifdriver"
config = { ctl_map = "0:2,1:5,2:6,3:7,4:8,5:15,6:10,7:11" }

# N8 Belle start-up (docs/devices/nokia-n8-rm596/belle-emergency-only.md): sastartupservice raises "SIM not ready"
# besides "SIM removed" when it first sees status 06 in global state 103 (security check); that late event turned
# KPSSimStatus 104 into 103 -> EmergencyCallsOnly (105). Seen in an earlier state it raises once and sets its done
# flag [V Delight 0x80e711a6]. A real modem reports "no SIM" when its SIM server starts, right after SAServer
# subscribes: send SIM_IND {05 06} on channel 35 at subscription.
[modem]
# With a SIM ([sim] present): SAServer {05 4A} (ESimUsable), the TSY {0D 0B 08 00 00} (SIM init OK), after the
# first SIM_STATUS (docs/research/n8-sim-present-mock.md 1.1, 1.2) [I values, V parsers]
indications = [{ res = 0x09, msg = 0xEF, data = "05 06", channel = 35, sim = false },
               { res = 0x09, msg = 0xEF, data = "05 4A", channel = 35, after = "09 C0", sim = true },
               { res = 0x09, msg = 0xEF, data = "0D 0B 08 00 00", channel = 7, after = "09 C0", sim = true }]
# SIM_STATUS service 01 (SIM lock): the real modem answers {01 24} with no SIM [V real N8 Delight, phonet 2026-11-11], but with
# 0x24 our start-up stops at the security check (sastartupservice takes its retry path, 0x80e71aa8) [V]; the family
# value 01 (lock OK) passes. Open: what else the real SIM server sends that makes 0x24 work.
