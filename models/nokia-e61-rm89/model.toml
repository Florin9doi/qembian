# Nokia E61 (RM-89): S60 3rd Edition on Symbian 9.1, a QWERTY E-series bar with a 320x240 landscape screen, WLAN.
# Started 2026-11-17 from the N73 profile (same 9.1 moving memory model, OMAP1710 generation); [N73] = taken over,
# not yet checked for the E61. Bring-up: docs/devices/nokia-e61-rm89/bring-up.md.
# Schema: docs/devices.md. Evidence tags: [V] checked against the firmware or a run, [I] inferred.
schema = 2
family = "bb5-s60"                         # platform/families/bb5-s60.toml, merged under this file

[device]
id = "nokia-e61-rm89"
vendor = "Nokia"
model = "E61"
type_code = "RM-89"                        # sw.txt / package names (RM-89, RM-089) [V]
aliases = ["e61"]
market = "global"

[platform]
os_version = "9.1"
ui = "s60-3.0"                             # S60 3rd Edition (no feature pack)
personality = "sym91"                      # personalities/sym91: the 9.2 exec tables + 9.1 loader structures
soc = "omap1710"                           # TI OMAP1710, ARM926EJ-S [I: spec sheet; ROM is ARMv5 moving model V]

# ---------------------------------------------------------------------------------------------
[firmware]
default = "3.0633.09.04"                   # models/nokia-e61-rm89/firmware/<name>/: the firmware a bare id loads
container = "fiasco-bb5"


[firmware.identity]                         # hardware every firmware of this phone carries (device.py identify)
drivers = []
no_drivers = []

[firmware.rom]
base = 0xF8000000                          # TRomHeader iRomBase [V]: moving memory model
kernel_data = 0x64000000                   # [V]
memory_model = "moving"                    # five fixed processes with data at 0x651..0x65B00000 [V]
paged = false                              # 9.1: no demand paging

# ---------------------------------------------------------------------------------------------
[board]
cpu = "arm926"                             # ARM926EJ-S (QEMU arm926 + patches/qemu-modern/0003 cache type)
ram_mb = 68                                # 64 MB on the phone, which also held the 20 MB core: our ROM image
                                           # (21.6 MB with our kernel side after the firmware) is extra, so the
                                           # free RAM is about what the phone had [I: 64 MB from spec sheets]
ram_mb_real = 64

[board.display]
width = 320                                # wsini.ini SCR_WIDTH8/SCR_HEIGHT8 = 320x240 at rotation 0, the only mode [V]
height = 240
native_orientation = "portrait"            # upright at rotation 0 (a landscape-shaped panel, no rotation) [V wsini]
line_pitch = 1280                          # 320 x 4: lcd_portrait's stride, d_display ctl 31
panel_rows = 240
caps_words = 23                            # r_display keeps 0x5c bytes of caps (CDisplayDriver +0x18..0x74) [V]
touch = false

[board.audio]
dsp = "ehwa"                               # TI DSP bridge stand-in; the N73 protocol differs only in the image load


[board.flash]
size_mb = 128                              # board.flash: the flash window medrofs serves the ROFS images from
[[board.drives]]
letter = "D"
local_drive = 0
kind = "iram"
flags = "FS_FORMAT_COLD,FS_SYNC_DRIVE"     # the N73's own line [V ESTARTCOMP.TXT]

[[board.drives]]
letter = "C"
local_drive = 1
kind = "nvmem"
image = "nvmemory.img"
size = "64M"
flags = "FS_FORMAT_CORRUPT,FS_SCANDRIVE"

[[board.drives]]
letter = "E"
local_drive = 2
kind = "nvmem2"
image = "nvmemory2.img"
size = "1G"
removable = true
flags = "FS_FORMAT_CORRUPT,FS_SCANDRIVE"   # miniSD card; a blank image is formatted (the phone would ask)

[[board.drives]]
letter = "Z"
local_drive = 8
kind = "composite"
flags = "FS_COMPOSITE"

# ---------------------------------------------------------------------------------------------
[hardware]
wlan = true                                # WLAN 802.11b/g [I spec]
bluetooth = true
camera = { main_mp = 0, front = false }    # the E61 has no camera (the E61i has) [I spec]
fm_radio = false
gps = false
accelerometer = false
slides = []
qwerty = true
leds = ["keypad-backlight", "display-backlight"]
memory_card = true                         # miniSD [I spec]
mass_memory_gb = 0
tv_out = true
dsp = "ti-dsp-bridge"
gpu = "none"

# ---------------------------------------------------------------------------------------------
[kernel]
baseport = "syborgmv"                      # tools/baseport_variant.py: moving memory model, ARM926, no VFP
place = "after-firmware"                   # our kernel side after the firmware image (scripts/build-standins.sh pad)
patchsets = ["platform", "sym92", "sym91", "policy"]
missing_drivers = ["ekeyp.dll", "camldd.ldd", "campdd.pdd", "camparifpdd.pdd", "bc02.ldd", "bc02_uart1.pdd", "usbisa.ldd", "eusbc.ldd", "stildd.ldd", "rebootdriver.ldd", "test.ldd", "ebridgeutil.ldd"]   # firmware kernel-side files with no stand-in (documented gaps)

[kernel.lcd]
target = "lcd_portrait"                    # src/standins/lcd/lcd_portrait.mmp

# Kernel-side stand-ins (src/standins), in obey order.
[[standins]]
name = "iscdriver"
kind = "ldd"
family = "nokia-bb5"
role = "modem link, older ISC naming (IscDriver), channels 0..31; fake CMT peer iscpeer.inl"

[[standins]]
name = "iscdriverextension"
kind = "ldd"
family = "nokia-bb5"
role = "modem link (IscDriverExtension), channels 32..63"

[[standins]]
name = "ssi"
kind = "pdd"
family = "nokia-bb5"
role = "ISC data transmission PDD (isc_config.ini): load only"

[[standins]]
name = "xbus"
kind = "ldd"
family = "nokia-bb5"
role = "load-only"

[[standins]]
name = "iscisimultiplexer"
kind = "ldd"
family = "nokia-bb5"
role = "load-only"

[[standins]]
name = "custom"
kind = "ldd"
family = "nokia-bb5"
role = "startup mode"
config = { api = 1 }                       # interface 1.0: start-up handshake by requests 0/1 [V EStart]

[[standins]]
name = "sosadlserver"
kind = "ldd"
family = "nokia-bb5"
role = "accepts everything"

[[standins]]
name = "d_display"
kind = "ldd"
family = "nokia-omap2"
role = "DisplayDriver (board config: 23 caps words, portrait panel, 960-byte stride)"

[[standins]]
name = "secldd"
kind = "ldd"
family = "nokia-bb5"
role = "SecEnv"

[[standins]]
name = "ehwa"
kind = "ldd"
family = "nokia-omap2"
role = "TI DSP bridge LDD (H-dspbridge)"
config = { bridge = "omap1710" }           # image load by buffer, shared buffer ctl 0x400000A (docs/devices/nokia-n73-rm132/dspbridge-n73.md)

[[standins]]
name = "ehwaomap"
kind = "pdd"
family = "nokia-omap2"
role = "TI DSP bridge PDD"

[[standins]]
name = "lightldd"
kind = "ldd"
family = "nokia-bb5"
role = "backlight LDD (H-lightdrv)"

[[standins]]
name = "lightpdd"
kind = "pdd"
family = "nokia-bb5"
role = "backlight PDD: load-only"

[[standins]]
name = "medrofs"
kind = "extension"
family = "common"
role = "ROFS1 + ROFx from the flash window on local drive 8"

[[standins]]
name = "mednvmem2"
kind = "extension"
family = "common"
role = "second NVMemory (E:) on local drive 2"


# ---------------------------------------------------------------------------------------------
[modem]

[rom]
code_patches = []
files = [{ rom = "Sys/Data/ESTARTCOMP.TXT", local = "ESTARTCOMP.TXT" }]

[gl]
impl = "none"                              # no GPU on the N73

[milestones]
idle = "SysAp::SysAp sets 101f8766/41 = 203"   # [V] as on the N95: Active Standby up

[props]
startup = { category = 0x101F8766, state = 0x41, ui_phase = 0x4 }

[status]
level = "L1"                               # first-boot city/date queries, then the active standby (Offline) (2026-11-18)
updated = "2026-11-18"
open = ["the E61's own keypad table (keys borrowed from the E72/E90)", "FaxModem.exe panics KERN-EXEC 3 (as the N73)", "seeded drives for the smoke test", "WLAN beyond start-up"]