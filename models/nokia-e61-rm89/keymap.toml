# Nokia E61 keys -> Symbian scan codes -> host keys (QEMU translates). FIRST DRAFT [I], 2026-11-17: softkeys, menu, the
# 5-way, call/end/clear and the side keys as the E72's (also an E-series QWERTY bar), the letters as the E90's
# qwerty group. The E61's own keypad table (Fn/digits on the letter keys) is not read yet.
schema = 1
device = "nokia-e61-rm89"

[[keys]]
key = "lsk"
label = "LSK"
scancode = "EStdKeyDevice0"
host = ["f5"]
set1 = 0x3f
group = "front"

[[keys]]
key = "ok"
label = "OK"
scancode = "EStdKeyDevice3"
host = ["f6", "ret"]
set1 = 0x40
group = "nav"

[[keys]]
key = "rsk"
label = "RSK"
scancode = "EStdKeyDevice1"
host = ["f7"]
set1 = 0x41
group = "front"

[[keys]]
key = "menu"
label = "Menu"
scancode = "EStdKeyApplication0"
host = ["f8"]
set1 = 0x42
group = "front"

[[keys]]
key = "up"
label = "^"
scancode = "EStdKeyUpArrow"
host = ["up"]
set1 = 0xc8
group = "nav"

[[keys]]
key = "down"
label = "v"
scancode = "EStdKeyDownArrow"
host = ["down"]
set1 = 0xd0
group = "nav"

[[keys]]
key = "left"
label = "<"
scancode = "EStdKeyLeftArrow"
host = ["left"]
set1 = 0xcb
group = "nav"

[[keys]]
key = "right"
label = ">"
scancode = "EStdKeyRightArrow"
host = ["right"]
set1 = 0xcd
group = "nav"

[[keys]]
key = "call"
label = "Call"
scancode = "EStdKeyYes"
host = ["f2"]
set1 = 0x3c
group = "front"

[[keys]]
key = "end"
label = "End"
scancode = "EStdKeyNo"
host = ["f3"]
set1 = 0x3d
group = "front"

[[keys]]
key = "clear"
label = "C"
scancode = "EStdKeyBackspace"
host = ["backspace"]
set1 = 0x0e
group = "front"

[[keys]]
key = "power"
label = "Power"
scancode = "EStdKeyDevice2"
host = ["f4"]
set1 = 0x3e
group = "side"

[[keys]]
key = "volup"
label = "Vol +"
scancode = "EStdKeyIncVolume"
host = ["f11"]
set1 = 0x57
group = "side"   # matrix 115

[[keys]]
key = "voldown"
label = "Vol -"
scancode = "EStdKeyDecVolume"
host = ["f12"]
set1 = 0x58
group = "side"   # matrix 102

