# Sony Ericsson P1i keys -> Symbian scan codes -> host keys. FIRST DRAFT [I]: the P1i's own
# keyboardscan.dll / jogdial.dll tables are not read yet; arrows and digits as on the N73 file.
schema = 1
device = "se-p1i"

[aliases]
select = "ok"

[[keys]]
key = "up"
label = "Up"
scancode = "EStdKeyUpArrow"
host = ["up"]
set1 = 0xc8
group = "nav"

[[keys]]
key = "down"
label = "Down"
scancode = "EStdKeyDownArrow"
host = ["down"]
set1 = 0xd0
group = "nav"

[[keys]]
key = "left"
label = "Left"
scancode = "EStdKeyLeftArrow"
host = ["left"]
set1 = 0xcb
group = "nav"

[[keys]]
key = "right"
label = "Right"
scancode = "EStdKeyRightArrow"
host = ["right"]
set1 = 0xcd
group = "nav"

[[keys]]
key = "ok"
label = "Ok"
scancode = "EStdKeyDevice3"
host = ["f6", "ret"]
set1 = 0x40
group = "nav"

[[keys]]
key = "back"
label = "Back"
scancode = "EStdKeyBackspace"
host = ["backspace", "esc"]
set1 = 0xe
group = "front"

[[keys]]
key = "power"
label = "Power"
scancode = "EStdKeyDevice2"
host = ["f4"]
set1 = 0x3e
group = "side"

[[keys]]
key = "1"
label = "1"
scancode = "'1'"
host = ["1"]
set1 = 0x2
group = "keypad"

[[keys]]
key = "2"
label = "2"
scancode = "'2'"
host = ["2"]
set1 = 0x3
group = "keypad"

[[keys]]
key = "3"
label = "3"
scancode = "'3'"
host = ["3"]
set1 = 0x4
group = "keypad"

[[keys]]
key = "4"
label = "4"
scancode = "'4'"
host = ["4"]
set1 = 0x5
group = "keypad"

[[keys]]
key = "5"
label = "5"
scancode = "'5'"
host = ["5"]
set1 = 0x6
group = "keypad"

[[keys]]
key = "6"
label = "6"
scancode = "'6'"
host = ["6"]
set1 = 0x7
group = "keypad"

[[keys]]
key = "7"
label = "7"
scancode = "'7'"
host = ["7"]
set1 = 0x8
group = "keypad"

[[keys]]
key = "8"
label = "8"
scancode = "'8'"
host = ["8"]
set1 = 0x9
group = "keypad"

[[keys]]
key = "9"
label = "9"
scancode = "'9'"
host = ["9"]
set1 = 0xa
group = "keypad"

[[keys]]
key = "0"
label = "0"
scancode = "'0'"
host = ["0"]
set1 = 0xb
group = "keypad"
