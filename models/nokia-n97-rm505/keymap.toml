# Nokia 5800 XpressMusic (RM-356) keys -> EStdKey scan codes -> host keys.
# Scan codes: the 5800's keypad_exp.dll 32-bit matrix table at 0x8010e77c (RM-356 V 31.0.101) [V]; matrix
# indexes in the comments. A touch phone: Call, Menu, End, camera, volume, and EStdKeyDevice7 (matrix 76,
# the side lock switch [I]). Power is not in the matrix (power-key path) [I]. Host keys as on the N95.
schema = 1
device = "nokia-n97-rm505"   # keys still the 5800's (a copy): the N97's own matrix table is not read yet (docs/research/qwerty-slide-5730-n97.md)

[[keys]]
key = "menu"
label = "Menu"
scancode = "EStdKeyApplication0"
host = ["f8"]
set1 = 0x42
group = "front"
row = 1
col = 0   # matrix 37

[[keys]]
key = "call"
label = "Call"
scancode = "EStdKeyYes"
host = ["f2"]
set1 = 0x3c
group = "front"
row = 2
col = 0   # matrix 24

[[keys]]
key = "end"
label = "End"
scancode = "EStdKeyNo"
host = ["f3"]
set1 = 0x3d
group = "front"
row = 2
col = 2   # matrix 50

[[keys]]
key = "power"
label = "Power"
scancode = "EStdKeyDevice2"
host = ["f4"]
set1 = 0x3e
group = "side"

[[keys]]
key = "volup"
label = "Vol +"
scancode = "EStdKeyIncVolume"
host = ["f11"]
set1 = 0x57
group = "side"   # matrix 89

[[keys]]
key = "voldown"
label = "Vol -"
scancode = "EStdKeyDecVolume"
host = ["f12"]
set1 = 0x58
group = "side"   # matrix 102

[[keys]]
key = "camera-half"
label = "Cam ½"
scancode = "EStdKeyApplication19"
host = ["f15"]
set1 = 0x5f
group = "side"   # matrix 63

[[keys]]
key = "lock"
label = "Lock"
scancode = "EStdKeyDevice7"
host = ["f13"]
group = "side"   # matrix 76 [I: the lock switch]

[[switches]]
name = "qwerty-slide"
positions = ["closed", "open"]
# the slide's QwertyOn/QwertyOff keys: the Context Framework's rule (ivalo_Qwerty.rul) turns the UI to landscape on
# open and publishes Device.Qwerty (docs/research/qwerty-slide-5730-n97.md) [V rule, I that the driver sends these]
open  = { scancode = "EStdKeyApplication7", host = ["f17"], set1 = 0x83, layout = "landscape" }
close = { scancode = "EStdKeyApplication8", host = ["f19"], set1 = 0x84, layout = "portrait" }
