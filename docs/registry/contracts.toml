[[contract]]
key = "hctl-bc02-transport"
component = "bt-hctl"
title = "H4+ HCTL over BC02: channel, framing, ownership, completion"
kind = "ipc"
status = "partial"
participants = "h4plushciv2_hctl.dll (client) -> BC02.LDD (LDD) -> bc02_uart1.PDD (hardware); hciaccess.dll and the BT stack above"
args = """
RECOVERED (module offsets from 0x8086DE98; docs/research/hctl-bc02-808.md sections 3, 4, A; re-synced 2026-11-17
from the document's corrected sections - the first seed carried readings the document later corrected):
open (+0x14A8): the user-side DLL loads PDD "BC02_UART1" and LDD "BC02" (User::LoadPhysicalDevice /
          LoadLogicalDevice at 0x8086E6F2/0x8086E6F6), then DoCreate(name="BC02", TVersion(1,0,0x21D), unit 4)
controls (d32comm.h numbering): 0 EControlConfig = read TCommConfigV01 (52 bytes); 1 EControlSetConfig = apply,
          iRate = EBpsSpecial (0x80000000 at +0) with iSpecialRate (+0x1C) = 120000 / 921600 / 4000000,
          iDataBits 3 (+4), 0 at +8/+0xC, 0x1204 later in the block; 3 EControlSignals, bit 0 = KSignalCTS polled
          1000 x 1 ms; 4 EControlSetSignals(set, clear): RTS (0x10) set after CTS, cleared in the type-6 handler;
          9 teardown/flush; 0xB abort receive (no caller here)
requests: 0 receive into obj+0x20; 1 transmit a descriptor, len = *des & 0x0FFFFFFF; 2 synchronous, meaning unknown
cancels:  DoCancel takes a bit MASK: 1 = request 0 (receive, completes KErrCancel), 2 = request 1 (transmit),
          4 = request 2 (BC02.LDD DoCancel +0x3BE8)
FRAMING: byte 0 = H4 type. TX: whole descriptor to request 1; upper layer told kind 2 for 0x01 (HCI command).
          RX demux (+0xEFA): 2 = ACL, length LITTLE-endian u16 at +3, total len+4; 3 = SCO; 4 = event (code +1,
          plen +2), forwarded first, then code 0x10 (Hardware Error) adds a -44 report; 6 = BC02 transport
          baud handshake (stores original bytes +12/+13, re-applies the config at 4 Mbaud); 7, 8 = transport.
          Types 6/7/8 are UART/transport level, not HCI.
BC02.LDD is the standard DChannelComm (ECOMM) LDD: a stand-in PDD registering as "BC02.<x>" behind a QEMU UART
with an HCI controller model is enough; the vendor init (h4plushciv2_initialisor.dll) is not read yet.
UNKNOWN: request 2's meaning; LDD-side buffer ownership; behaviour of a pending receive at Close.
"""
completion = """
Three distinct things must not be conflated: transport write completion (request 1's TRequestStatus), the
baud handshake (a type-6 packet within 4 s of the post-init transmit, else the CTimer at obj+0x18 fires), and
controller events (type 4: forwarded as data; code 0x10 Hardware Error additionally reported as -44).
"""
cancellation = "DoCancel(mask): 1 cancels the receive (request 0, KErrCancel), 2 the transmit (request 1); the HCTL cancels the receive with mask 1 (H4pHctl_CancelReceive 0x8086EEF6)"
errors = "KErrTimedOut (-33) if CTS (control 3 bit 0) never appears within ~1 s; KErrInUse (-14) transmitting on a closed transport; -44 after a Hardware Error event (0x10); KErrNotSupported (-5) from the baud selector for any other value"
source = "docs/research/hctl-bc02-808.md; decompilation ghidra/h4plushciv2_hctl.dll.c; Ghidra program h4plushciv2_hctl.dll.elf"

