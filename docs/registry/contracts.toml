# SEED ONLY - imported by `tools/registry.py seed`; the database is canonical afterwards.
#
# A contract is what a *participant outside a component* may rely on. status: known | partial | unknown.
# Claims cite contracts by key; tasks say which objective (capability) they unblock.

[[objective]]
key = "hosted-compositor"
title = "Validate the hosted compositor against the phone's own render stage"
notes = """
We can run Belle's WSERV render stage (gcerenderstage.dll) against our composition backend (src/gcebe) only
when the completions it depends on are answered correctly. The blocking question is the surface-update
completion/cancellation contract, not the whole compositor.
"""

[[objective]]
key = "telephony-lifecycle"
title = "A documented, repeatable 808 telephony lifecycle (success, absence, cancellation)"
notes = """
One user-visible operation end to end (open phone, read SIM/registration, subscribe, cancel, close, reopen)
with every outstanding request explained. The modem model is the deliverable; the phone's own TSY is the oracle.
"""

[[objective]]
key = "wserv-replaceability"
title = "Decide whether available WSERV source can replace this firmware's server"
notes = """
Establish export sets, plugin interfaces and behavioural differences between the EPL source and Belle FP2's
EwSrv/Ws32 before committing to anything. Outcome is a decision, not a rewrite.
"""

[[objective]]
key = "boot-parity"
title = "Every device boots to its home screen with no unexplained stand-in silence"
notes = "The baseline objective: what works on each target, and which contract blocks the next capability."

[[contract]]
