[[objective]]
key = "vibra-device"
title = "A real vibra device in QEMU, driven by the phone's own haptics stack - no driver stand-in"
notes = """
The 808 reaches the vibration motor over ISI (1C 9E), not through a kernel driver, so the goal is reachable
without any LDD/PDD replacement: understand the packet, answer it correctly, and drive a syborg device from the
same handler the modem model already owns.
"""

[[contract]]
key = "haptics-isi-vibra"
component = "haptics"
title = "HWRM haptics over ISI: request 1C 9E, response 1C 9F"
kind = "protocol"
status = "known"
participants = "hapticsadaptation.dll (sender, for EwSrv's FeedbackPlayerThread), hwrmhapticsvibepacketizerplugin.dll (packet), our fake modem/PMU"
args = """
REQUEST (hapticsadaptation.dll +0x6C0, FUN_80f195a8; argument is a TDesC8, so *(u32)arg is its length):
  ISI words: 3=0x1C, 8=channel (obj+0xC), 9=0x9E, 0x0A=0, 0x0B=1, 0x0C=100, 0x10=0, 0x12=0
  0x0E = (aligned total message size) - 12, where total = ((L & 0xffff) + 0x16) rounded up to 4
  0x14 = L & 0xffff            <- packet LENGTH
  0x16 = packet contents       <- L bytes, zero-filled to the aligned size
RESPONSE (hapticsadaptation.dll +0x5B8, FUN_80f194a0), read by raw offset:
  word@0x0A must be 0; word@0x0B must be NON-ZERO; word@0x11 must be 0;
  u16@0x14 = payload length; descriptor@0x16 = the packet handed up as (error, packet) via
  hwrmhapticspluginservice ord3. Any mismatch yields error -2 (KErrGeneral).
  NOTE: several parser branches read BYTE +2 as a status, while the request places command arguments there, so
  request and response layouts differ even for the same opcode. Identical numbers do not imply identical layout.
PACKET: opcode-specific layouts, 16-bit opcode at offset 0. Cases handled by
hwrmhapticsvibepacketizerplugin.dll include 4, 5, 7, 8, 9, 0x10, 0x11, 0x12, 0x13, 0x16-0x20; 0x11/0x12/0x13/0x1B
also update stored state (e.g. a cached value at obj+0x28, appends to a CDesC8Array). Any other opcode leaves with -2.
Field table per opcode is what haptics-isi-packet still owes; there is no established common TLV format.
"""
completion = """
A failure reply (non-zero status) is accepted and the caller continues - that is what we do today. A success
reply needs a parseable packet at 0x16; an empty one makes the plugin wait for effect data that never arrives
(observed UI freeze on the N8). Whether completion means "accepted by the PMU" or "effect finished", what sets
intensity/duration, and how Stop works are all UNKNOWN.
"""
cancellation = "not established (no cancel path observed in the adaptation)"
errors = "response word@0x0A != 0 or word@0x11 != 0 or word@0x0B == 0 -> error -2 (KErrGeneral) for the effect"
source = "platform/isi/replies-bb5.txt (1C 9E entry); docs/research/gcerenderstage-808.md (workflow)"

